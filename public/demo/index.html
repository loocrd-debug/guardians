<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민원 신청 안내 — 예시 페이지</title>
<style>
body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#f4f5f7;color:#222}
.top{background:#1d3f8f;color:#fff;padding:18px 32px;font-size:20px;font-weight:700}
.wrap{max-width:960px;margin:28px auto;padding:0 24px}
.hero{background:#fff;border-radius:12px;padding:28px;display:flex;gap:24px;align-items:center}
.hero img{width:260px;height:150px;border-radius:8px;background:#cfd8ea}
.notice{color:#b8bcc4;font-size:14px;margin-top:10px}
.form{background:#fff;border-radius:12px;padding:24px;margin-top:20px}
.form input{width:70%;height:40px;border:1px solid #ccc;border-radius:6px;padding:0 10px}
.btn{display:inline-block;margin-left:8px;height:42px;padding:0 18px;border-radius:6px;background:#1d3f8f;color:#fff;border:0;font-size:15px}
.links a{margin-right:16px}
.demo{position:fixed;right:12px;bottom:12px;background:#111;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px}
</style></head>
<body>
<div class="top">○○시청 민원 안내</div>
<div class="wrap">
  <div class="hero">
    <img src="/demo/banner.svg">
    <div><div style="font-size:24px;font-weight:700">온라인으로 민원을 신청하세요</div>
    <p class="notice">※ 접수된 민원은 3일 이내에 처리됩니다.</p></div>
  </div>
  <div class="form">
    <input type="text" placeholder="민원 제목">
    <div class="btn" onclick="alert('신청')">신청</div>
  </div>
  <p class="links"><a href="#">자세히 보기</a><a href="#">자세히 보기</a></p>
</div>
<div class="demo">가디언즈 시연용 예시 페이지 (고치기 전)</div>
</body></html>
